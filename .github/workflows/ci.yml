name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: ruff check . --select E9,F63,F7,F82

      - name: MyPy
        run: mypy src/fpl_ai_agent/config.py src/fpl_ai_agent/config_schema.py src/fpl_ai_agent/utils/logging_utils.py

      - name: Pytest
        run: pytest -q
