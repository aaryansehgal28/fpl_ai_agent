[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-ai-agent"
version = "0.1.0"
description = "AI-driven Fantasy Premier League system with forecasting, optimisation, and agent layers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "FPL AI Team"}]
dependencies = [
  "duckdb>=1.1.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "numpy>=2.0.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "hydra-core>=1.3.0",
  "torch>=2.4.0",
  "pulp>=2.8.0",
  "rapidfuzz>=3.9.0",
  "splink>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
